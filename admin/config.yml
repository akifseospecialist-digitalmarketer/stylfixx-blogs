# ===== DecapBridge login =====
backend:
  name: git-gateway
  repo: akifseospecialist-digitalmarketer/stylfixx-blogs
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/cf584867-58e9-4b05-a2e5-a6c5ca414e9e/pkce
  auth_token_endpoint: /sites/cf584867-58e9-4b05-a2e5-a6c5ca414e9e/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://stylfixx.com

# ===== Media =====
media_folder: "images"
public_folder: "/blog/images"
publish_mode: simple
locale: en

# ===== Blog posts form =====
collections:
  - name: posts
    label: Blog Posts
    label_singular: Blog Post
    folder: content/posts
    create: true
    extension: json
    format: json
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "[{{status}}] {{title}} ({{category}}, {{date}})"
    sortable_fields: [date, title, status]
    view_filters:
      - { label: "Draft", field: status, pattern: "draft" }
      - { label: "Scheduled", field: status, pattern: "scheduled" }
      - { label: "Published", field: status, pattern: "published" }
    view_groups:
      - { label: "Status", field: status }
    fields:
      - { label: "Title (H1)", name: title, widget: string }
      - { label: "URL Slug", name: slug, widget: string, pattern: ['^[a-z0-9-]+$', "Sirf small letters, numbers aur - (jaise best-paint-colors-2026)"], hint: "Post banane ke baad badalna mat, URL toot jayega" }
      - { label: "SEO Title (Google me dikhega)", name: seo_title, widget: string, required: false }
      - { label: "Category", name: category, widget: select, options: ["Construction", "Interior Design"], default: "Construction" }
      - label: "Status"
        name: status
        widget: select
        options:
          - { label: "📝 Draft", value: "draft" }
          - { label: "⏰ Scheduled", value: "scheduled" }
          - { label: "✅ Published", value: "published" }
        default: "draft"
        hint: "Draft = site par nahi dikhega | Scheduled = neeche ke date/time par live | Published = abhi live"
      - label: "Publish Date & Time"
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        picker_utc: false
        hint: "Scheduled ke liye future date + time daalo (IST). Published ke liye aaj ki date."
      - { label: "Featured Image", name: image, widget: image, choose_url: false }
      - { label: "Meta Description (150-160 chars)", name: description, widget: text }
      - { label: "Keywords (comma se alag)", name: keywords, widget: text, required: false }
      - { label: "Article ke end me Contact/CTA box dikhao", name: show_cta, widget: boolean, default: true }
      - { label: "Article", name: body, widget: markdown, hint: "Heading ke liye H2 use karo (Table of Contents H2 se banta hai)" }
      - label: "FAQs (Google schema apne aap banega)"
        name: faqs
        widget: list
        required: false
        summary: "{{fields.question}}"
        fields:
          - { label: "Question", name: question, widget: string }
          - { label: "Answer", name: answer, widget: text }
